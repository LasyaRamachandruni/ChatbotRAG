# Static pages, email templates, the knowledge base and the recorded eval output are kept byte-for-byte.
exclude: '^(extras/|knowledge_base/|evals/results\.md$)|\.(html|js|css)$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Uses the mypy from requirements-dev.txt; install requirements.txt too so streamlit is typed.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
